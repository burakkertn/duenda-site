<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sayfa bulunamadı · Duenda</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
<script>
  // Arkadaş daveti kısa linki: /f/K7P2XQ → /f/?code=K7P2XQ (GitHub Pages'te alt sayfa yok, buradan yönlenir).
  (function () {
    var m = location.pathname.match(/^\/f\/([A-Za-z0-9-]{6,7})\/?$/);
    if (m) location.replace('/f/?code=' + m[1].replace('-', ''));
  })();
</script>
</head>
<body>
<div class="wrap">
<main>
<h1>Bu sayfayı bulamadım</h1>
<p class="lede"><a href="/tr/">Duenda ana sayfasına dön</a> · <a href="/">Go to Duenda</a></p>
</main>
</div>
</body>
</html>
