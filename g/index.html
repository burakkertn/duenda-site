<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oyun daveti · Duenda</title>
<meta name="description" content="Duenda'da seni bir oyuna çağırıyorlar.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131D" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="brand" href="../tr/"><img src="../img/icon-96.png" alt="" width="40" height="40"><span class="name">Duenda</span></a>
</header>
<main>
<div class="hello">
  <img src="../img/duenda-happy.webp" alt="" width="112" height="112">
  <div class="bubble"><span class="who">Duenda</span><p>Hadi, oyun zamanı! · Let's play!</p></div>
</div>
<p class="eyebrow">Oyun daveti · <span lang="en">Game invite</span></p>
<h1>Duenda açılıyor…</h1>
<p class="lede">Uygulama açılmadıysa aşağıdaki düğmeye dokun. Duenda yüklü değilse önce TestFlight'tan yükle.</p>
<div class="row"><a id="open" class="btn primary" href="#">Duenda'da aç · Open in Duenda</a></div>
</main>
</div>
<script>
  // Davet linki: https://duenda.app/g/?id=<oyun> → uygulama "duenda://open/g?id=<oyun>" ile oyunda açılır.
  (function () {
    var id = new URLSearchParams(location.search).get('id') || '';
    if (!/^[0-9a-fA-F-]{36}$/.test(id)) { document.getElementById('open').removeAttribute('href'); return; }
    var url = 'duenda://open/g?id=' + id;
    document.getElementById('open').href = url;
    location.href = url;
  })();
</script>
</body>
</html>
